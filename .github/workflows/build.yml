name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --uac-admin --name BrowserCacheTool --hidden-import win32security --hidden-import win32api --hidden-import pywintypes main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BrowserCacheTool-windows
          path: dist/BrowserCacheTool.exe
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BrowserCacheTool.exe
          fail_on_unmatched_files: true
